<mat-toolbar color="primary" class="navbar">
  <div class="left-container">
    <div class="logo-container" [routerLink]="'/'">
      <img [src]="logoUrl" alt="Logo" class="logo" />
      <span>{{ applicationName }}</span>
    </div>
    <button class="back-button" (click)="goBack()">{{isAuthenticated ? 'My clubs' : 'All clubs'}}</button>
  </div>   
  <div class="nav-links">
    <a [routerLink]="['/club', clubId, 'main']" routerLinkActive="active">Main</a>
    <a [routerLink]="['/club', clubId, 'player']" routerLinkActive="active">Players</a>
    <a [routerLink]="['/club', clubId, 'achievements']" routerLinkActive="active">Achievements</a>
  </div>
</mat-toolbar>
