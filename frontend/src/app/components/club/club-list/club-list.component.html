<div>
  <button (click)="goBack()">Go Back</button>
  <button (click)="goHome()">Start screen</button>
</div>

@if (clubs && clubs.length > 0) {
    <div>
      @for (club of clubs; track $index) {
        <div 
        tabindex="0" 
        (click)="viewClubDetails(club.clubId)" 
        (keydown.enter)="viewClubDetails(club.clubId)" 
        (keydown.space)="viewClubDetails(club.clubId)">
          <h3>{{ club.name }}</h3>
          <span class="fi" [class]="'fi-'+getCountryCode(club.address.country)"></span> 
          <p>Founded: {{ club.foundedYear }}</p>
          <img [src]="club.badge || defaultBadgeUrl" alt="Club Badge" />
        </div>
      }
    </div>
}
@else {
  <div>There is no football clubs... You can be the first to create one!</div>
}
