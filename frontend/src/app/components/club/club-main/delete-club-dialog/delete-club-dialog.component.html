<h2 mat-dialog-title>Confirm club deletion</h2>
<mat-dialog-content>
  Are you sure you want to delete this club?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close (click)="onCancel()">Cancel</button>
  <button mat-button mat-dialog-close cdkFocusInitial color="warn" (click)="onConfirm()">Delete</button>
</mat-dialog-actions>
